[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deckify"
version = "1.0.0"
description = "Turn Markdown into a beautiful, self-contained HTML slide deck"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "someone-rs" }]
keywords = ["slides", "markdown", "presentation", "html"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.scripts]
deckify = "deckify.cli:main"

[project.urls]
Homepage = "https://github.com/someone-rs/deckify"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
